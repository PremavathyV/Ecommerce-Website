<main class="container contact-page">
<h2 class="section-title">Get in touch</h2>
<form id="contactForm" class="contact-form">
<label>Full name<input type="text" name="name" required></label>
<label>Email<input type="email" name="email" required></label>
<label>Message<textarea name="message" rows="6" required></textarea></label>
<div class="form-actions">
<button type="submit" class="btn-cta small">Send Message</button>
<a class="btn-outline" href="mailto:youremail@example.com">Email directly</a>
</div>
<p class="form-note">Tip: the form will open your email client with the message prefilled (client-side). For real server delivery use a backend or Google Apps Script.</p>
</form>
</main>
