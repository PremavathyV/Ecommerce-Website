<!-- CART MODAL -->
<div id="cartModal" class="btn-outline">
  <div class="btn-outline">
    <h2>Your Cart</h2>
    <button id="closeCart" class="close-cart">✕</button>

    <div id="cartItems"></div>

    <h3>Total: ₹<span id="cartTotal">0</span></h3>

    <button class="checkout-btn">Checkout</button>
  </div>
</div>
<style>/* CART MODAL BACKDROP */
.cart-modal {
  position: fixed;
  inset: 0;
  background: rgba(0, 0, 0, 0.65);
  display: none;
  justify-content: center;
  align-items: center;
  z-index: 3000;
}

/* CART BOX */
.btn-outline {
  background: #0b0b0b;
  padding: 22px;
  width: 90%;
  max-width: 480px;
  border-radius: 16px;
  color: var(--white);
  box-shadow: 0 8px 28px rgba(0,0,0,0.4);
  position: relative;
  animation: popIn 0.25s ease;
}

/* MODAL ANIMATION */
@keyframes popIn {
  from { transform: scale(0.85); opacity: 0; }
  to   { transform: scale(1); opacity: 1; }
}

/* CLOSE BUTTON */
.close-cart {
  position: absolute;
  top: 12px;
  right: 12px;
  font-size: 22px;
  background: transparent;
  border: none;
  cursor: pointer;
  color: var(--accent);
  font-weight: 700;
}

/* CART ITEMS */
.cart-item {
  background: #111;
  padding: 12px;
  border-radius: 12px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 12px;
  border: 1px solid rgba(255,255,255,0.08);
}

.cart-item img {
  width: 60px;
  height: 60px;
  object-fit: contain;
  border-radius: 8px;
}

/* REMOVE BUTTON */
.remove-btn {
  background: #e63939;
  padding: 6px 12px;
  border-radius: 8px;
  border: none;
  color: #fff;
  cursor: pointer;
  font-size: 14px;
  transition: 0.2s;
}
.remove-btn:hover {
  background: #c82323;
}

/* TOTAL */
#cartTotal {
  font-weight: 700;
  color: var(--accent);
}

/* CHECKOUT BUTTON */
.checkout-btn {
  width: 100%;
  padding: 14px;
  border-radius: 12px;
  background: var(--accent);
  border: none;
  font-size: 16px;
  color: #fff;
  cursor: pointer;
  margin-top: 10px;
  transition: 0.25s;
}
.checkout-btn:hover {
  transform: translateY(-2px);
}

/* HEADER CART BADGE */
.cart-badge {
  background: var(--accent);
  padding: 6px 12px;
  border-radius: 40px;
  font-weight: 700;
  font-size: 14px;
  margin-left: 6px;
  color: #fff;
}
</style>
